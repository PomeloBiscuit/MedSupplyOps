  <g class="foreign-key" data-constraint="FK_IDENTITY_USERS_DEPARTMENT" data-source="IDENTITY_USERS.DEPARTMENT_ID" data-target="DEPARTMENTS.DEPARTMENT_ID" data-delete-rule="NO ACTION"><title>IDENTITY_USERS.DEPARTMENT_ID → DEPARTMENTS.DEPARTMENT_ID (NO ACTION)</title><path d="M 754 346 V 353 H 24 V 173 H 354 V 166" fill="none" stroke="#40566d" stroke-width="1.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/></g>
  <g class="foreign-key" data-constraint="FK_IDENTITY_USER_ROLES_ROLE" data-source="IDENTITY_USER_ROLES.ROLE_ID" data-target="IDENTITY_ROLES.ID" data-delete-rule="NO ACTION"><title>IDENTITY_USER_ROLES.ROLE_ID → IDENTITY_ROLES.ID (NO ACTION)</title><path d="M 428 468 V 475 H 38 V 286 H 336 V 279" fill="none" stroke="#40566d" stroke-width="1.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/></g>
  <g class="foreign-key" data-constraint="FK_IDENTITY_USER_ROLES_USER" data-source="IDENTITY_USER_ROLES.USER_ID" data-target="IDENTITY_USERS.ID" data-delete-rule="NO ACTION"><title>IDENTITY_USER_ROLES.USER_ID → IDENTITY_USERS.ID (NO ACTION)</title><path d="M 336 468 V 484 H 52 V 362 H 336 V 346" fill="none" stroke="#40566d" stroke-width="1.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/></g>
  <g class="legend" font-family="&quot;Microsoft JhengHei&quot;, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, sans-serif" fill="#263746">
    <rect x="82" y="516" width="876" height="138" rx="6" fill="#f7f9fb" stroke="#c6d0da"/>
    <line x1="100" y1="538" x2="147" y2="538" stroke="#40566d" stroke-width="2"/><text x="156" y="543" font-size="12">CASCADE</text>
    <line x1="237" y1="538" x2="284" y2="538" stroke="#40566d" stroke-width="2" stroke-dasharray="8 6"/><text x="293" y="543" font-size="12">NO ACTION / RESTRICT</text>
    <line x1="472" y1="538" x2="519" y2="538" stroke="#40566d" stroke-width="2" stroke-dasharray="2 5"/><text x="528" y="543" font-size="12">SET NULL</text><text x="642" y="543" font-size="12" font-weight="700">底線＝主鍵</text>
    <text x="100" y="566" font-size="11">本 schema 沒有 ON DELETE CASCADE，所以所有箭頭都是虛線。</text>
    <text x="100" y="588" font-size="11">稽核欄位：IS_DELETED、DELETED_AT、DELETED_BY、CREATED_AT、CREATED_BY、</text>
    <text x="100" y="605" font-size="11">UPDATED_AT、UPDATED_BY、ROW_VERSION。</text>
    <text x="100" y="627" font-size="11">Identity 內建欄位：NORMALIZED_*、EMAIL_CONFIRMED、PASSWORD_HASH、SECURITY_STAMP、CONCURRENCY_STAMP、</text>
    <text x="100" y="644" font-size="11">PHONE_*、TWO_FACTOR_ENABLED、LOCKOUT_*、ACCESS_FAILED_COUNT。</text>
  </g>
